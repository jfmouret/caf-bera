name: BERA quotidien
run-name: "BERA et Nivôse — ${{ github.event_name }}"
on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'data/**'
      - '.github/workflows/update.yml'
  workflow_dispatch:
    inputs:
      offline:
        description: Générer et publier le paquet hors ligne
        type: boolean
        default: false
  schedule:
    - cron: '30 16,18,20 * * *'
      timezone: 'Europe/Paris'
    - cron: '30 6,10,14 * * *'
      timezone: 'Europe/Paris'
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
concurrency:
  group: bera-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NIVOSE_ONLY: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 6,10,14 * * *') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[nivose]')) }}
    steps:
      - name: Journaliser le déclenchement et les horloges
        env:
          TRIGGER: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Événement : $TRIGGER ; programmation : $SCHEDULE ; Nivôse seul : $NIVOSE_ONLY"
          date -u '+UTC : %Y-%m-%d %H:%M:%S'
          TZ=Europe/Paris date '+Paris : %Y-%m-%d %H:%M:%S %Z'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Vérifier la présence de la clé
        if: env.NIVOSE_ONLY != 'true'
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
        run: |
          if [ -z "$MF_API_KEY" ]; then
            echo '::error::Le secret de dépôt MF_API_KEY est absent ou vide.'
            exit 1
          fi
      - name: Générer les données actuelles
        if: env.NIVOSE_ONLY != 'true'
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
        run: python bera.py --all-alps --online-only --base-url https://jfmouret.github.io/caf-bera
      - name: Trouver la dernière publication à conserver
        if: env.NIVOSE_ONLY == 'true'
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api 'repos/jfmouret/caf-bera/actions/workflows/update.yml/runs?status=success&per_page=1' --jq '.workflow_runs[0].id')
          test "$run_id" != null
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Reprendre les fichiers BERA et l'historique publiés
        if: env.NIVOSE_ONLY == 'true'
        uses: actions/download-artifact@v4
        with:
          name: bera-en-ligne
          path: dist
          github-token: ${{ github.token }}
          repository: jfmouret/caf-bera
          run-id: ${{ steps.previous.outputs.run_id }}
      - name: Générer les stations Nivôse Alpes
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
          MF_OBS_API_KEY: ${{ secrets.MF_OBS_API_KEY }}
        run: python nivose.py --online-only --output dist --base-url https://jfmouret.github.io/caf-bera
      - name: Préparer les téléchargements et le paquet manuel éventuel
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATE_OFFLINE: ${{ github.event_name == 'workflow_dispatch' && inputs.offline }}
        run: |
          if [ "$GENERATE_OFFLINE" = true ]; then
            python offline_package.py --generate --publish
          else
            python offline_package.py
          fi
      - name: Vérifier la publication légère
        run: |
          python - <<'PY'
          import json,zipfile,xml.etree.ElementTree as ET
          from pathlib import Path
          from PIL import Image
          from nivose import stamp
          d=json.loads(Path('dist/nivose.json').read_text())
          for s in d['stations']:
              h=s.get('history',[])
              ts=[stamp(b['measured_at']) for b in h]
              assert ts==sorted(set(ts))
              if s.get('chart_local'):Image.open(Path('dist')/s['chart_local']).verify()
              print(s['name'],len(h),'mesures')
          for f in ('bera-contours.kmz','nivose-alpes.kmz','nivose-belledonne.kmz'):
              with zipfile.ZipFile(Path('dist')/f) as z:
                  assert z.testzip() is None
                  assert not any(n.startswith(('media/','nivose-media/')) for n in z.namelist())
                  ET.fromstring(z.read('doc.kml'))
          assert not list(Path('dist').glob('*.mbtile*'))
          assert not (Path('dist')/'bera-alpes.kmz').exists()
          bs=json.loads(Path('dist/bulletins.json').read_text())['bulletins']
          print('BERA affichés :',sum(b['display_level'] is not None for b in bs))
          print('Nivôse avec mesure :',sum(bool(s.get('observation')) for s in d['stations']))
          print('Taille des fichiers en ligne :',round(sum(p.stat().st_size for p in Path('dist').rglob('*') if p.is_file())/1000000,1),'Mo')
          Path('dist/.nojekyll').touch()
          PY
      - name: Réduire les anciennes archives avant le nouveau transfert
        env:
          GH_TOKEN: ${{ github.token }}
        run: python prune_artifacts.py --before-upload --apply
      - uses: actions/upload-artifact@v4
        with:
          name: bera-en-ligne
          path: dist
          retention-days: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4

      - name: Limiter les archives après publication réussie
        env:
          GH_TOKEN: ${{ github.token }}
        run: python prune_artifacts.py --apply
