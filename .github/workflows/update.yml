name: BERA quotidien
on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'data/**'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 16,18,20 * * *'
      timezone: 'Europe/Paris'
    - cron: '15 */2 * * *'
      timezone: 'Europe/Paris'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bera-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Vérifier la présence de la clé
        if: github.event_name != 'schedule' || github.event.schedule != '15 */2 * * *'
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
        run: |
          if [ -z "$MF_API_KEY" ]; then
            echo '::error::Le secret de dépôt MF_API_KEY est absent ou vide.'
            exit 1
          fi
      - name: Générer les données actuelles
        if: github.event_name != 'schedule' || github.event.schedule != '15 */2 * * *'
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
        run: python bera.py --all-alps --mbtiles --base-url https://jfmouret.github.io/caf-bera
      - name: Trouver la dernière publication à conserver
        if: github.event_name == 'schedule' && github.event.schedule == '15 */2 * * *'
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api 'repos/jfmouret/caf-bera/actions/workflows/update.yml/runs?status=success&per_page=1' --jq '.workflow_runs[0].id')
          test "$run_id" != null
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Reprendre les fichiers BERA et l'historique publiés
        if: github.event_name == 'schedule' && github.event.schedule == '15 */2 * * *'
        uses: actions/download-artifact@v4
        with:
          name: bera-fichiers
          path: dist
          github-token: ${{ github.token }}
          repository: jfmouret/caf-bera
          run-id: ${{ steps.previous.outputs.run_id }}
      - name: Générer les stations Nivôse Alpes
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
          MF_OBS_API_KEY: ${{ secrets.MF_OBS_API_KEY }}
        run: python nivose.py --output dist --base-url https://jfmouret.github.io/caf-bera
      - name: Vérifier les séries et les graphiques Nivôse hors ligne
        run: |
          python - <<'PY'
          import json,zipfile,io,xml.etree.ElementTree as ET,re
          from pathlib import Path
          from PIL import Image
          from nivose import stamp
          d=json.loads(Path('dist/nivose.json').read_text())
          for s in d['stations']:
              h=s.get('history',[])
              ts=[stamp(b['measured_at']) for b in h]
              assert ts==sorted(set(ts)), 'Historique désordonné ou dupliqué'
              print(s['name'],len(h),'mesures',h[0]['measured_at'] if h else 'sans historique')
          for filename in ('nivose-alpes.kmz','nivose-belledonne.kmz'):
              with zipfile.ZipFile(Path('dist')/filename) as z:
                  assert z.testzip() is None
                  root=ET.fromstring(z.read('doc.kml'))
                  for e in root.iter():
                      if e.tag.endswith('description') and e.text:
                          for src in re.findall(r'src="([^"]+)"',e.text):
                              Image.open(io.BytesIO(z.read(src))).verify()
                  print(filename,'graphiques intégrés vérifiés')
          PY
      - name: Vérifier les illustrations hors ligne
        run: python validate_offline.py
      - name: Résumé des données obtenues
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('dist/bulletins.json').read_text())
          bs=data['bulletins']
          api=sum(b.get('source','').startswith('https://public-api.meteofrance.fr/') for b in bs)
          valid=sum(b.get('nominal_valid',False) for b in bs)
          displayed=sum(b['display_level'] is not None for b in bs)
          print(f'Bulletins provenant de l API : {api}/{len(bs)} ; bulletins dans leur échéance initiale : {valid} ; derniers bulletins affichés : {displayed}.')
          if not api: print('::warning::Aucun bulletin XML API obtenu. Consulter les statuts HTTP dans bulletins.json ; les archives servent de repli.')
          obs=json.loads(Path('dist/nivose.json').read_text())
          stations=obs['stations']
          measured=sum(bool(s.get('observation')) for s in stations)
          print(f'Nivôse : {measured}/{len(stations)} stations avec une mesure.')
          if obs.get('access_error'): print('::warning::'+obs['access_error'])
          if not measured: print('::warning::Aucune mesure Nivôse récupérée ; les repères indiquent leur indisponibilité.')
          Path('dist/.nojekyll').touch()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bera-fichiers
          path: dist
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
